name: Flutter Instrumented Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "app/integration_test/**"
      - "app/lib/**"
      - "feature/**/lib/**"
      - "core/**/lib/**"
      - "melos.yaml"
      - "**/pubspec.yaml"

concurrency:
  group: flutter-instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected-tests:
    name: Connected Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Melos
        run: |
          dart pub get
          dart run melos bootstrap

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Flutter tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: cd app && flutter test integration_test
